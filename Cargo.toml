[package]
name = "groove"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "groove"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
indexmap = "=2.2.6"

[profile.release]
opt-level = 3
lto = true
